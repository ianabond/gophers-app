# HTTP -> HTTPS redirect (same path)
server {
    listen 80;
    server_name bunnyburrowgame.fun;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bunnyburrowgame.fun;

    ssl_certificate     /etc/letsencrypt/live/bunnyburrowgame.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bunnyburrowgame.fun/privkey.pem;

    add_header X-Content-Type-Options nosniff always;

    location /ws {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}