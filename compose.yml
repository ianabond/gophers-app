services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gophers
      POSTGRES_USER: gophers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gophers_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophers -d gophers"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-server:
    build: ./auth-server
    environment:
      PORT: 3001
      DATABASE_URL: postgres://gophers:${POSTGRES_PASSWORD:-gophers_dev_password}@db:5432/gophers
      KEYS_DIR: /keys
      JWT_EXPIRES_IN: 24h
    volumes:
      - auth_keys:/keys
    depends_on:
      db:
        condition: service_healthy

  app-server:
    build:
      context: .
      dockerfile: app-server/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://gophers:${POSTGRES_PASSWORD:-gophers_dev_password}@db:5432/gophers
      AUTH_PUBLIC_KEY_URL: http://auth-server:3001/public-key
    depends_on:
      db:
        condition: service_healthy
      auth-server:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-server
      - app-server

volumes:
  pgdata:
  auth_keys:
