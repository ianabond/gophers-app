services:
  nginx:
    image: nginx:1.27
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

  app:
    build: ./app
    environment:
      DATABASE_URL: postgres://game:${POSTGRES_PASSWORD}@db:5432/gamedb?sslmode=disable
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gamedb
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata: